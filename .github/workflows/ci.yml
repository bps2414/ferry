name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyftpdlib

      # Rar.exe (só para gerar os arquivos de teste) é baixado do rarlab.com pelo E2E
      - uses: actions/cache@v4
        with:
          path: e2e/tools
          key: rar-6.24

      - name: E2E
        run: dotnet run --project e2e

      - name: Relatório E2E
        if: always()
        run: Get-Content e2e_report.md -ErrorAction SilentlyContinue >> $env:GITHUB_STEP_SUMMARY

      - name: Publicar exe
        run: dotnet publish app -c Release -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: PS5Sender
          path: dist/PS5Sender.exe

      # Tag v*: anexa o exe à release (cria se não existir; tag com "-" vira pré-release)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist/PS5Sender.exe --clobber
          } elseif ($env:TAG -like '*-*') {
            gh release create $env:TAG dist/PS5Sender.exe --title "PS5 Sender $env:TAG" --generate-notes --prerelease
          } else {
            gh release create $env:TAG dist/PS5Sender.exe --title "PS5 Sender $env:TAG" --generate-notes
          }
