<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferry — Travessia</title>
  <link rel="icon" href="../../web/ui/logo.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: Geist; src: url(../../app/fonts/Geist-Regular.ttf); font-weight: 400; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #E9EDF3; background: #0A0D12; font-family: Geist, sans-serif; }
    main { max-width: 1080px; padding: 38px 40px 60px; margin: auto; }
    header { color: #9AADCA; font-size: 13px; letter-spacing: .1em; padding-bottom: 22px; border-bottom: 1px solid #242F3E; }
    .stage { min-height: 320px; display: grid; place-items: center; }
    .stage img { width: min(640px, 100%); height: auto; }
    button { display: block; margin: 0 auto; background: #141D2A; color: #E9EDF3; border: 1px solid #354458; border-radius: 6px; padding: 11px 16px; font: inherit; font-size: 13px; cursor: pointer; }
    .row { display: flex; flex-wrap: wrap; align-items: end; gap: 28px; margin-top: 48px; padding-top: 32px; border-top: 1px solid #242F3E; }
    figure { margin: 0; display: grid; justify-items: center; gap: 10px; }
    figcaption { font-size: 11px; color: #8490A2; }
    .light { background: #F4F6FA; border-radius: 10px; padding: 24px; margin-top: 32px; }
    .light img { width: min(420px, 100%); display: block; }
  </style>
</head>
<body>
  <main>
    <header>FERRY / TRAVESSIA</header>
    <div class="stage"><img id="motion" src="../../web/ui/brand/ferry-logo-animated.svg" alt="Ferry: balsa sobre uma onda e o nome"></div>
    <button id="replay" type="button">Repetir animação</button>
    <div class="row">
      <figure><img src="../../web/ui/brand/ferry-icon.svg" width="16" height="16" alt=""><figcaption>16 px</figcaption></figure>
      <figure><img src="../../web/ui/brand/ferry-icon.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
      <figure><img src="../../web/ui/brand/ferry-icon.svg" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
      <figure><img src="../../web/ui/brand/ferry-icon.svg" width="174" height="174" alt=""><figcaption>174 px</figcaption></figure>
    </div>
    <div class="light"><img src="../../web/ui/brand/ferry-logo-light.svg" alt="Ferry em fundo claro"></div>
  </main>
  <script>
    const motion = document.getElementById("motion");
    document.getElementById("replay").onclick = () => { const src = motion.src; motion.src = ""; motion.src = src; };
  </script>
</body>
</html>
